# Local stack. `docker compose up` brings the application, data services, and
# Ollama. Observability remains behind a profile.
#
#   docker compose up                          # application + data + Ollama
#   docker compose --profile observability up   # + langfuse
services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [postgres, redis]

  # One-shot job: writes embeddings to PostgreSQL and the lexical index to the
  # named BM25 volume. Run with `make ingest` after the model profile is up.
  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    env_file: .env
    volumes:
      - bm25data:/var/lib/rag/bm25
    depends_on: [postgres, ollama]

  postgres:
    image: pgvector/pgvector:pg16   # postgres + pgvector extension
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  # --- optional: local models ---
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollamadata:/root/.ollama

  # --- optional: tei for bge-m3 ---
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    ports: ["8000:80"]
    volumes: ["model-cache:/data"]
    environment: ["MODEL_ID=BAAI/bge-m3"]
    command: --model-id BAAI/bge-m3

  # --- optional: observability ---
  langfuse:
    profiles: ["observability"]
    image: langfuse/langfuse:2
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [postgres]

volumes:
  pgdata:
  redisdata:
  bm25data:
  ollamadata:
  model-cache:
