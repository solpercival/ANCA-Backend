# Local stack. `docker compose up` brings the application, data services, and
# Ollama. Observability remains behind a profile.
#
#   docker compose up                          # application + data + Ollama
#   docker compose --profile observability up   # + langfuse
services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    env_file: .env
    ports: ["8080:8080"]
    depends_on: 
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # One-shot job: writes embeddings to PostgreSQL. Run with `make ingest` after the model profile is up.
  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    env_file: .env
    depends_on: [postgres, ollama]

  postgres:
    image: pgvector/pgvector:pg16   # postgres + pgvector extension
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  # --- optional: local models ---
  ollama:
    image: ollama/ollama:latest
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["11434:11434"]
    volumes:
      - ollamadata:/root/.ollama

  # --- optional: observability ---
  langfuse:
    profiles: ["observability"]
    image: langfuse/langfuse:2
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [postgres]

volumes:
  pgdata:
  redisdata:
  ollamadata:
