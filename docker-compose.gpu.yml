# GPU override: gives the NVIDIA GPU to Ollama (generation + embeddings) and to the
# orchestrator (Qwen3 reranker, RERANK_PROVIDER=qwen3). Both share the one GPU.
# Applied automatically by the Makefile when nvidia-smi is present, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d ollama
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
  orchestrator:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
