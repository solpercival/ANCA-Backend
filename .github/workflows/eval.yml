name: Evaluation (GPU)

# DISABLED by default. Runs the live eval (eval/run_eval.py --gold, the same as
# `make eval`) against docs/docs-proto/starter-kit/alarms/reference-answers.json:
# retrieval and answer scores from the real models, so it needs a self-hosted
# runner with a GPU. Enable once that runner is registered:
#   1. Register a self-hosted runner with label `gpu`.
#   2. Change the `if:` below to `true` (or remove it).
#   3. Point `runs-on` at your runner labels.
#   4. Add steps before the eval to bring the stack up (make up / migrate /
#      ingest) and set EVAL_USERNAME / EVAL_PASSWORD with a seeded user: the
#      eval calls the running API and logs in, which this job does not yet do.

on:
  workflow_dispatch:        # manual trigger only
  schedule:
    - cron: "0 3 * * 1"     # weekly, Monday 03:00 (runs only when enabled)

jobs:
  eval:
    if: ${{ false }}                 # <-- flip to true when a GPU runner exists
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive      # docs submodule needed for gold answers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (models + eval extras)
        run: pip install -e ".[models,eval]"

      - name: Run evaluation suite
        run: python -m eval.run_eval --gold docs/docs-proto/starter-kit/alarms/reference-answers.json
