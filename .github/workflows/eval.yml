name: Evaluation (GPU)

# DISABLED by default. This job loads the real Qwen3 models and runs the
# Ragas/DeepEval suite against docs/reference-answers.json, so it needs a
# self-hosted runner with a GPU. Enable once that runner is registered:
#   1. Register a self-hosted runner with label `gpu`.
#   2. Change the `if:` below to `true` (or remove it).
#   3. Point `runs-on` at your runner labels.

on:
  workflow_dispatch:        # manual trigger only
  schedule:
    - cron: "0 3 * * 1"     # weekly, Monday 03:00 (runs only when enabled)

jobs:
  eval:
    if: ${{ false }}                 # <-- flip to true when a GPU runner exists
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive      # docs submodule needed for gold answers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (models + eval extras)
        run: pip install -e ".[models,eval]"

      - name: Run evaluation suite
        run: python -m eval.run_eval --gold docs/reference-answers.json
